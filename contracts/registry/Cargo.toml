[package]
name = "registry"
description = "Understudy registry: NEP-171 agent NFTs, each tied to a vault sub-account, with on-chain hiring and escrow."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/XohamOG/understudy"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
